<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Dashboard BOE - Backoffice Esercizio</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    section { margin-bottom: 20px; }
    label, select, input { margin: 4px 0; display: block; }
    table, th, td { border: 1px solid #ccc; border-collapse: collapse; padding: 8px; }
    th { background-color: #f2f2f2; }
  </style>
</head>
<body>
  <h1>Dashboard Backoffice Esercizio (BOE)</h1>

  <section>
    <h2>Richieste dal BOA</h2>
    <table>
      <thead>
        <tr><th>ID Richiesta</th><th>ID Treno</th><th>Tipo</th><th>Data</th><th>Azione</th></tr>
      </thead>
      <tbody id="tblRichieste">
        <!-- dinamico -->
      </tbody>
    </table>
  </section>

  <script>
    const token = localStorage.getItem('token');

    async function caricaRichieste() {
      const res = await fetch('/api/boe/richieste', {
        headers: { 'Authorization': 'Bearer ' + token }
      });
      const richieste = await res.json();
      const tbody = document.getElementById('tblRichieste');
      tbody.innerHTML = '';

      richieste.forEach(r => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${r.id}</td>
          <td>${r.id_treno}</td>
          <td>${r.tipo}</td>
          <td>${new Date(r.data_richiesta).toLocaleString()}</td>
          <td><button onclick="gestisci(${r.id})">Completa</button></td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function gestisci(id) {
      const ok = confirm("Segna come completata la richiesta #" + id + "?");
      if (!ok) return;

      await fetch('/api/boe/richieste/' + id + '/completa', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token }
      });

      alert("Richiesta completata");
      caricaRichieste();
    }

    caricaRichieste();
  </script>
</body>
</html>
