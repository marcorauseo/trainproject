<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Treni Turistici Jennifer Lyn</title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;margin:0;padding:0}
    header{background:#0077b6;color:#fff;padding:10px 18px;display:flex;justify-content:space-between;align-items:center}
    #brand{font-weight:bold;font-size:1.3rem}
    #userArea button{margin-left:8px}
    table{border-collapse:collapse;width:100%;margin-top:12px}
    th,td{border:1px solid #ccc;padding:6px 8px;text-align:center}
    th{background:#f0f0f0}
    dialog{border:none;border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,.25);padding:24px}
    dialog form{display:flex;flex-direction:column;gap:12px}
    dialog::backdrop{background:rgba(0,0,0,.4)}
  </style>
</head>
<body>
  <header>
    <span id="brand">Jennifer Lyn Trains • Orari linea turistica</span>
<div id="userArea">
  <span id="welcome" style="display:none"></span>
  <button id="btnLogin">Login</button>
  <button id="btnRegister">Registrati</button>
  <button id="logout" style="display:none">Logout</button>
</div>
  </header>

  <table id="tblOrari">
    <thead>
      <tr><th>Treno</th><th>Da</th><th>A</th><th>Partenza</th><th>Arrivo</th></tr>
    </thead>
    <tbody></tbody>
  </table>

  <!-- Dialog Login -->
  <dialog id="dlgLogin">
    <h3>Login</h3>
    <form id="frmLogin" method="dialog">
      <input id="loginEmail" type="email" placeholder="Email" required />
      <input id="loginPwd" type="password" placeholder="Password" required />
      <div>
        <button type="submit">Accedi</button>
        <button type="button" onclick="dlgLogin.close()">Annulla</button>
      </div>
    </form>
  </dialog>

  <!-- Dialog Registrazione -->
  <dialog id="dlgReg">
    <h3>Registrazione</h3>
    <form id="frmReg" method="dialog">
      <input id="regNome" type="text" placeholder="Nome" required />
      <input id="regCognome" type="text" placeholder="Cognome" required />
      <input id="regEmail" type="email" placeholder="Email" required />
      <input id="regPwd" type="password" placeholder="Password (≥8)" minlength="8" required />
      <div>
        <button type="submit">Crea account</button>
        <button type="button" onclick="dlgReg.close()">Annulla</button>
      </div>
    </form>
  </dialog>

  <script>


    /* ---------- login / registrazione UI ----------- */
    const dlgLogin = document.getElementById('dlgLogin');
    const dlgReg   = document.getElementById('dlgReg');
    document.getElementById('btnLogin').onclick    = () => dlgLogin.showModal();
    document.getElementById('btnRegister').onclick = () => dlgReg.showModal();

    /* saluta se già loggato */
function updateWelcome() {
  const jwt = localStorage.getItem('token');
  const user = localStorage.getItem('user');
  if (jwt && user) {
    document.getElementById('welcome').textContent = 'Benvenuto ' + user;
    document.getElementById('welcome').style.display = 'inline';
    document.getElementById('btnLogin').style.display =
    document.getElementById('btnRegister').style.display = 'none';
    document.getElementById('logout').style.display = 'inline';
  }
  else {
    document.getElementById('welcome').style.display = 'none';
    document.getElementById('btnLogin').style.display =
    document.getElementById('btnRegister').style.display = 'inline';
    document.getElementById('logout').style.display = 'none';
  }}
    updateWelcome();

    /* login fetch */
    document.getElementById('frmLogin').addEventListener('submit', async e => {
      e.preventDefault();
      const email = loginEmail.value, password = loginPwd.value;
      const res = await fetch('/api/auth/login', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (res.ok) {
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', data.nome || email);
        dlgLogin.close();
        console.log('Login effettuato:', data);
        updateWelcome();
        alert('Login effettuato con successo!');
        /* reindirizza alla dashboard */
       location.href = '/dashboard.html';   
        
      } else {
        alert(data.error || 'Credenziali errate');
      }
    });

    /* registrazione fetch */
    document.getElementById('frmReg').addEventListener('submit', async e => {
      e.preventDefault();
      const body = {
        nome: regNome.value,
        cognome: regCognome.value,
        email: regEmail.value,
        password: regPwd.value
      };
      const res = await fetch('/api/auth/register', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify(body)
      });
      const data = await res.json();
      if (res.ok) {
dlgReg.close();
alert('Registrazione avvenuta! Effettua il login.');
dlgLogin.showModal();  
      } else {
        const msg = data.errors ? data.errors[0].msg : data.error;
        alert(msg || 'Errore di registrazione');
      }
    });
  </script>
  <script>
    /* --- dialog login/registrazione chiuso --- */
    dlgLogin.addEventListener('close', () => {
      document.getElementById('loginEmail').value = '';
      document.getElementById('loginPwd').value = '';
    });
    dlgReg.addEventListener('close', () => {
      document.getElementById('regNome').value = '';
      document.getElementById('regCognome').value = '';
      document.getElementById('regEmail').value = '';
      document.getElementById('regPwd').value = '';
    });
  </script>

  <script>
    /* --- redirect se non loggato --- */
    const token = localStorage.getItem('token');
    if (!token) {
      location.href = '/index.html';
    }

    /* mostra il nome */
    const userName = localStorage.getItem('user');
    if (userName) {
      document.getElementById('welcome').textContent = 'Benvenuto ' + userName;
      document.getElementById('welcome').style.display = 'inline';
    } 
  </script>  

  <script>
    /* --- logout --- */
    document.getElementById('logout').onclick = () => {
      localStorage.clear();
      location.href = '/index.html';
    };

    /* --- carica orari & costruisci tabella --- */
    async function loadTable() {
      const res = await fetch('/api/public/timetable');
      const data = await res.json();
      const tbody = document.querySelector('#tblOrari tbody');
      tbody.innerHTML = '';
      data.forEach(r => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${r.id_treno}</td>
          <td>${r.stazione_partenza}</td>
          <td>${r.stazione_arrivo}</td>
          <td>${r.orario_partenza}</td>
          <td>${r.orario_arrivo}</td>
          <td><button class="compra">Compra</button></td>`;
        tr.querySelector('.compra').onclick = () => compraBiglietto(r.id_treno);
        tbody.appendChild(tr);
      });
    }

    /* --- acquisto biglietto --- */
async function compraBiglietto(idTreno) {
  const token = localStorage.getItem('token');
  if (!token) {
    alert('⚠️ Fai login o registrati per comprare un biglietto.');
    return;
  }

  const posto = prompt('Numero posto (vuoto = automatico)') || 'AUTO';

  const res = await fetch('/api/tickets/buy', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + token
    },
    body: JSON.stringify({ tratta_id: idTreno, posto })
  });

  const data = await res.json();
  if (res.ok) {
    location.href = data.redirect;
  } else {
    alert(data.error || 'Errore acquisto');
  }
}

    loadTable();
  </script>


</body>
</html>
