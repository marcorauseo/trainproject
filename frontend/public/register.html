<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registrazione</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h2>Registrazione</h2>
  <form id="registerForm">
    <label for="nome">Nome:</label>
    <input type="text" id="nome" required />
    <label for="cognome">Cognome:</label>
    <input type="text" id="cognome" required />
    <label for="email">Email:</label>
    <input type="email" id="email" required />
    <label for="password">Password:</label>
    <input type="password" id="password" required />
    <label for="cellulare">Cellulare:</label>
    <input type="text" id="cellulare" />
    <label for="data_nascita">Data di Nascita:</label>
    <input type="date" id="data_nascita" />
    <label for="luogo_nascita">Luogo di Nascita:</label>
    <input type="text" id="luogo_nascita" />
    <button type="submit">Registrati</button>
  </form>
  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const user = {
        nome: document.getElementById('nome').value,
        cognome: document.getElementById('cognome').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
        cellulare: document.getElementById('cellulare').value,
        data_nascita: document.getElementById('data_nascita').value,
        luogo_nascita: document.getElementById('luogo_nascita').value
      };
      const response = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(user)
      });
      const data = await response.json();
      if (response.ok) {
        alert('Registrazione avvenuta con successo');
        // window.location.href = '/login.html';
      } else {
        alert(data.error);
      }
    });
  </script>
</body>
</html>
